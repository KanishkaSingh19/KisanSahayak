# Runs the full test suite on every push and pull request.
# No API keys are used: answers come from the offline template and search uses the local
# embedder, so the run is free, repeatable and needs no secrets.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            requirements.txt

      # The lightweight cloud requirements (no PyTorch / MiniLM) plus the API and test packages
      - name: Install dependencies
        run: |
          pip install -r frontend/requirements.txt
          pip install fastapi uvicorn python-multipart httpx openai pytest

      # The accuracy and feature test sets (eval/, evalset/) are not run here: they measure search
      # quality, which needs the MiniLM or Gemini embeddings used by the real app.
      - name: Run tests
        run: python -m pytest -q -p no:warnings
